name: tests

# Auto-run on push/PR disabled — was failing and emailing on every commit.
# Uncomment push/pull_request below to re-enable CI, or run manually via Actions.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check backend ui
      - name: Pytest
        run: python -m pytest backend/tests -q --ignore=backend/tests/test_examples_dashboards.py
