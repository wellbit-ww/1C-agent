<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excel Agent</title>
    <script>

          document.documentElement.dataset.theme = "light";

    <script type="module" src="/src/main.tsx"></script>
